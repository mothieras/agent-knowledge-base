name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall -q rag_agent core api db schema client document_chunker.py config.py utils.py
        working-directory: project

      - name: Run tests
        run: python -m pytest tests/ -q
        working-directory: .
