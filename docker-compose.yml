services:
  api:
    build:
      context: ./project
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - project/.env
    volumes:
      - ./qdrant_db:/app/qdrant_db
      - ./parent_store:/app/parent_store
      - ./markdown_docs:/app/markdown_docs
      - hf-cache:/root/.cache/huggingface
    restart: unless-stopped

  gradio:
    build:
      context: ./project
      dockerfile: Dockerfile
    command: ["python", "app.py"]
    ports:
      - "7860:7860"
    environment:
      - API_URL=http://api:8000
      - GRADIO_SERVER_NAME=0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  ingest:
    build:
      context: ./project
      dockerfile: Dockerfile
    command: ["python", "ingest_corpus.py"]
    env_file:
      - project/.env
    volumes:
      - ./qdrant_db:/app/qdrant_db
      - ./parent_store:/app/parent_store
      - ./markdown_docs:/app/markdown_docs
      - hf-cache:/root/.cache/huggingface
    profiles:
      - ingest

volumes:
  hf-cache:
